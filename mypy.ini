[mypy]
# Global mypy configuration for MangaReader v0.1.5

# Import discovery
mypy_path = src
namespace_packages = True
explicit_package_bases = True

# Platform configuration
python_version = 3.9
platform = linux

# Strictness settings (gradual typing approach)
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True

# Type checking behavior
check_untyped_defs = True
disallow_untyped_calls = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_decorators = False

# None and Optional handling
no_implicit_optional = True
strict_optional = True

# Error reporting
show_error_context = True
show_column_numbers = True
show_error_codes = True
pretty = True
color_output = True
error_summary = True

# Incremental mode
incremental = True
cache_dir = .mypy_cache

# Per-module overrides

# PyQt5 modules (third-party, ignore)
[mypy-PyQt5.*]
ignore_missing_imports = True

# PIL/Pillow (third-party, ignore)
[mypy-PIL.*]
ignore_missing_imports = True

# rarfile (optional dependency)
[mypy-rarfile.*]
ignore_missing_imports = True

# Core modules - enforce stricter checking
[mypy-src.constants]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-src.exceptions]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-src.logger]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-src.paths]
disallow_untyped_defs = True
check_untyped_defs = True

# Modules with partial type hints - moderate checking
[mypy-src.database]
check_untyped_defs = True

[mypy-src.settings]
check_untyped_defs = True

[mypy-src.cache_manager]
check_untyped_defs = True

[mypy-src.updater]
check_untyped_defs = True

# View modules - basic checking (large refactored files)
[mypy-src.views.*]
check_untyped_defs = True
warn_return_any = False

# Test files - relaxed checking
[mypy-tests.*]
ignore_errors = True
